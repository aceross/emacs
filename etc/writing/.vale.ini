# Copy this directory into a manuscript project and review its rules.
# Tested with Vale 3.24.0; no packages are downloaded by the editor.
StylesPath = styles
MinAlertLevel = suggestion
IgnoredScopes = code, tt, kbd, samp, frontmatter

[*.{md,markdown,qmd,org}]
BasedOnStyles = Academic
# One citation pattern avoids overlapping TokenIgnores. Includes locators,
# narrative citations, Org cite variants, and Quarto cross-reference keys.
TokenIgnores = (\[\[(?:https?|file):[^\]\n]+\]\]|\[cite(?:/[^:\]\n]+)?:[^\]\n]+\]|\[[^\]\n]*@[^\]\n]+\]|(?<!\w)@[\w:./-]+), (\$[^$\n]+\$|\\\([^\n]*?\\\)), (\b[a-z]+_[a-z_]+\b)

[*.{md,markdown,qmd}]
BlockIgnores = (?s)(\$\$.*?\$\$|\\\[.*?\\\])

[*.org]
# Vale 3.24 recognises uppercase blocks only. Capture their BODY, replacing
# the delimiters with Vale's uppercase example wrapper. Maths is omitted.
# One pattern avoids nesting wrappers inside already ignored source blocks.
BlockIgnores = (?ims)(?:^[ \t]*#\+begin_(?:src|example)[^\n]*\n(.*?)^[ \t]*#\+end_(?:src|example)[^\n]*$|\$\$.*?\$\$|\\\[.*?\\\])
