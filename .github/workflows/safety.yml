name: Safety, preferences and package recovery

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install distribution Emacs
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y emacs-nox git python3
      - name: Exercise safety, preference restarts and pinned bootstrap with disposable fixtures
        run: |
          emacs --version
          git --version
          emacs -Q --batch -l test/run-safety-tests.el
          emacs -Q --batch -L site-elisp -l awc-packages --eval '(let ((user-emacs-directory default-directory)) (awc-packages-read-snapshot))'
      - name: Exercise explicit writing and manuscript boundaries with disposable fixtures
        run: |
          python3 --version
          PYTHONDONTWRITEBYTECODE=1 python3 test/test_paper_runner.py
          emacs -Q --batch -L site-elisp -L test -l awc-writing-test -l awc-paper-test -f ert-run-tests-batch-and-exit
